<!-- Floating chat inquiry widget (authenticated console users only) -->
<div id="chat-widget" class="fixed bottom-4 right-4 z-9999">
  <button
    id="chat-toggle"
    type="button"
    class="rounded-full bg-brand-500 px-4 py-2 text-white shadow-theme-md"
  >
    Chat
  </button>
  <div
    id="chat-panel"
    class="mt-2 hidden w-80 rounded-lg border border-gray-200 bg-white p-3 shadow-theme-lg dark:border-gray-700 dark:bg-gray-900"
  >
    <div id="chat-messages" class="mb-2 max-h-64 overflow-y-auto text-sm"></div>
    <form id="chat-form" class="flex gap-2">
      <input
        id="chat-input"
        type="text"
        class="flex-1 rounded border border-gray-300 px-2 py-1 text-sm dark:border-gray-700 dark:bg-gray-800"
        placeholder="Ask about documents..."
      />
      <button type="submit" class="rounded bg-brand-500 px-3 py-1 text-sm text-white">
        Send
      </button>
    </form>
  </div>
</div>
