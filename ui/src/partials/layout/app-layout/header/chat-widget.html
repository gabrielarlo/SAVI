<!-- Floating chat inquiry widget (authenticated console users only) -->
<div id="chat-widget" class="fixed bottom-4 right-4 z-9999">
  <button
    id="chat-toggle"
    type="button"
    class="rounded-full bg-brand-500 px-4 py-2 text-white shadow-theme-md"
  >
    Chat
  </button>
  <div
    id="chat-panel"
    class="mt-2 hidden flex max-h-[80vh] w-96 flex-col rounded-xl border border-gray-200 bg-white shadow-theme-lg dark:border-gray-700 dark:bg-gray-900"
  >
    <div class="flex items-center justify-between border-b border-gray-200 px-4 py-3 dark:border-gray-700">
      <span id="chat-title" class="font-semibold text-gray-800 dark:text-white">Chat</span>
      <div class="flex items-center gap-2">
        <select
          id="chat-tenant"
          class="rounded-lg border border-gray-300 px-2 py-1 text-xs text-gray-800 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-100"
          title="Tenant scope for this inquiry"
        ></select>
        <button
          id="chat-new"
          type="button"
          class="text-xs text-brand-500 hover:underline"
        >
          New conversation
        </button>
      </div>
    </div>
    <div id="chat-tenant-hint" class="hidden px-4 py-1 text-xs text-amber-600 dark:text-amber-400">
      Select an account to start chatting.
    </div>
    <div
      id="chat-messages"
      class="min-h-0 flex-1 space-y-2 overflow-x-hidden overflow-y-auto break-words px-4 py-3 text-sm"
    ></div>
    <form id="chat-form" class="flex gap-2 border-t border-gray-200 px-4 py-3 dark:border-gray-700">
      <textarea
        id="chat-input"
        rows="1"
        class="flex-1 resize-none rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-800 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-100"
        placeholder="Type a message (markdown supported)..."
      ></textarea>
      <button
        id="chat-mic"
        type="button"
        class="rounded-lg border border-gray-300 px-3 py-2 text-gray-700 dark:border-gray-700 dark:text-gray-200"
        title="Record voice"
      >
        <svg id="chat-mic-icon" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
          <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
          <line x1="12" y1="19" x2="12" y2="23" />
          <line x1="8" y1="23" x2="16" y2="23" />
        </svg>
      </button>
      <button type="submit" class="rounded-lg bg-brand-500 px-4 py-2 text-sm text-white">
        Send
      </button>
    </form>
  </div>
</div>
<script>window.LOCALRAG_CODE_NAME = window.LOCALRAG_CODE_NAME || "Assistant";</script>
<script src="/console/config.js" onerror="window.LOCALRAG_CODE_NAME = window.LOCALRAG_CODE_NAME || 'Assistant';"></script>
<script>
  (function () {
    var name = (window.LOCALRAG_APP_NAME || "LocalRAG").trim() || "LocalRAG";
    var shortDesc = window.LOCALRAG_APP_SHORT_DESCRIPTION || "";
    var apply = function () {
      document.querySelectorAll(".app-brand").forEach(function (el) {
        el.textContent = name;
      });
      document.querySelectorAll(".app-short-desc").forEach(function (el) {
        el.textContent = shortDesc;
      });
      if (document.title && document.title.indexOf("LocalRAG") !== -1) {
        document.title = document.title.replace("LocalRAG", name);
      }
    };
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", apply);
    } else {
      apply();
    }
  })();
</script>
