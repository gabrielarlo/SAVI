<!doctype html>
<html lang="en">
  <head>
    <base href="/console/" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Sign in | LocalRAG</title>
    <script>window.LOCALRAG_APP_NAME = window.LOCALRAG_APP_NAME || "LocalRAG";</script>
    <script src="/console/config.js" onerror="window.LOCALRAG_APP_NAME = window.LOCALRAG_APP_NAME || 'LocalRAG';"></script>
    <script>
      (function () {
        var name = (window.LOCALRAG_APP_NAME || "LocalRAG").trim() || "LocalRAG";
        var apply = function () {
          document.querySelectorAll(".app-brand").forEach(function (el) {
            el.textContent = name;
          });
          if (document.title && document.title.indexOf("LocalRAG") !== -1) {
            document.title = document.title.replace("LocalRAG", name);
          }
        };
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", apply);
        } else {
          apply();
        }
      })();
    </script>
  </head>
  <body
    x-data="{ page: 'signin', 'loaded': true, 'darkMode': false, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode')) ?? false;
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <!-- ===== Preloader Start ===== -->
    <include src="./partials/common/preloader.html"></include>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="relative z-1 bg-white p-6 sm:p-0 dark:bg-gray-900">
      <div
        class="relative flex h-screen w-full flex-col justify-center sm:p-0 lg:flex-row dark:bg-gray-900"
      >
        <div class="flex w-full flex-1 flex-col lg:w-1/2">
          <div class="mx-auto flex w-full max-w-md flex-1 flex-col justify-center">
            <a href="/console/documents" class="mb-8 inline-block">
              <span
                class="app-brand text-2xl font-semibold text-gray-800 dark:text-white"
                >LocalRAG</span
              >
            </a>

            <h1
              class="mb-2 text-2xl font-semibold text-gray-800 dark:text-white/90"
            >
              Sign in
            </h1>
            <p class="mb-6 text-sm text-gray-500 dark:text-gray-400">
              Enter the admin secret to manage documents.
            </p>

            <form id="signin-form" class="space-y-5" novalidate>
              <div>
                <label
                  for="username"
                  class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
                  >Username</label
                >
                <input
                  id="username"
                  name="username"
                  type="text"
                  autocomplete="username"
                  required
                  autofocus
                  class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
                />
              </div>

              <div>
                <label
                  for="password"
                  class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
                  >Password</label
                >
                <div class="relative">
                  <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                    class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 pr-10 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
                  />
                  <button
                    type="button"
                    id="password-toggle"
                    class="absolute right-2 top-1/2 -translate-y-1/2 p-1 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200"
                    aria-label="Show password"
                    title="Show password"
                  >
                    <svg
                      id="password-toggle-icon"
                      xmlns="http://www.w3.org/2000/svg"
                      width="18"
                      height="18"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                  </button>
                </div>
              </div>

              <p
                id="signin-error"
                role="alert"
                class="hidden rounded-lg border border-red-500 bg-red-50 px-4 py-3 text-sm text-red-600 dark:border-red-500/30 dark:bg-red-500/15 dark:text-red-400"
              ></p>

              <button
                id="signin-submit"
                type="submit"
                class="flex w-full items-center justify-center rounded-lg bg-brand-500 px-4 py-3 text-sm font-medium text-white transition hover:bg-brand-600 disabled:cursor-not-allowed disabled:opacity-60"
              >
                Sign in
              </button>
            </form>

            <p class="mt-6 text-xs text-gray-500 dark:text-gray-400">
              No email required. The session is kept in this browser tab only and
              is cleared when you sign out.
            </p>
          </div>
        </div>

        <include src="./partials/others/auth/auth-cover.html" />
        <include src="./partials/others/auth/theme-toggler.html" />
      </div>
    </div>
    <!-- ===== Page Wrapper End ===== -->
  </body>
</html>
