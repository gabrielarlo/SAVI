<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Dashboard | LocalRAG</title>
    <script>
      (function () {
        if (!sessionStorage.getItem("localrag.sessionToken") && !sessionStorage.getItem("localrag.adminSecret")) {
          window.location.replace("/auth/signin");
        }
      })();
    </script>
  </head>
  <body
    x-data="{ page: 'dashboard', 'loaded': true, 'darkMode': false, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode')) ?? false;
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <!-- ===== Preloader Start ===== -->
    <include src="./partials/common/preloader.html"></include>
    <!-- ===== Preloader End ===== -->
    <div class="flex h-screen overflow-hidden">
      <include src="./partials/layout/app-layout/sidebar/index.html"></include>
      <div class="relative flex flex-1 flex-col overflow-x-hidden overflow-y-auto">
        <include src="./partials/layout/app-layout/header/index.html" />
        <main id="main-content">
          <div class="mx-auto max-w-(--breakpoint-2xl) p-4 pb-20 md:p-6 md:pb-6">
            <div x-data="{ pageTitle: 'Dashboard' }">
              <include src="./partials/common/page-breadcrumb.html" />
            </div>
            <div class="rounded-2xl border border-gray-200 bg-white p-6 dark:border-gray-800 dark:bg-white/[0.03]">
              <p class="text-sm text-gray-500 dark:text-gray-400">Dashboard (placeholder).</p>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
