<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Users | LocalRAG</title>
  </head>
  <body
    x-data="{ page: 'users', 'loaded': true, 'darkMode': false, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode')) ?? false;
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <include src="./partials/common/preloader.html"></include>
    <div class="flex h-screen overflow-hidden">
      <include src="./partials/layout/app-layout/sidebar/index.html"></include>
      <div class="relative flex flex-1 flex-col overflow-x-hidden overflow-y-auto">
        <include src="./partials/layout/app-layout/header/index.html" />
        <main id="main-content">
          <div class="mx-auto max-w-(--breakpoint-2xl) p-4 pb-20 md:p-6 md:pb-6">
            <div x-data="{ pageTitle: 'Users' }">
              <include src="./partials/common/page-breadcrumb.html" />
            </div>
            <div class="space-y-5 sm:space-y-6">
              <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/3">
                <div class="flex flex-wrap items-center justify-between gap-3 border-b border-gray-100 px-4 py-4 sm:px-6 dark:border-gray-800">
                  <div>
                    <h3 class="text-base font-medium text-gray-800 dark:text-white/90">Users</h3>
                    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Users can be archived but never deleted. Passwords are stored hashed.</p>
                  </div>
                  <div class="flex items-center gap-3">
                    <button id="refresh" type="button" class="rounded-lg border border-gray-300 px-3 py-2 text-sm font-medium text-gray-700 transition hover:bg-gray-50 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-white/5">Refresh</button>
                    <button id="create-open" type="button" class="rounded-lg bg-brand-500 px-4 py-2 text-sm font-medium text-white transition hover:bg-brand-600">Create User</button>
                  </div>
                </div>
                <div class="overflow-x-auto">
                  <table class="w-full min-w-[42rem]">
                    <thead>
                      <tr class="border-b border-gray-100 dark:border-gray-800">
                        <th class="px-5 py-3 text-left text-xs font-medium tracking-wide text-gray-500 uppercase dark:text-gray-400">Username</th>
                        <th class="px-5 py-3 text-left text-xs font-medium tracking-wide text-gray-500 uppercase dark:text-gray-400">Role</th>
                        <th class="px-5 py-3 text-left text-xs font-medium tracking-wide text-gray-500 uppercase dark:text-gray-400">Created</th>
                        <th class="px-5 py-3 text-left text-xs font-medium tracking-wide text-gray-500 uppercase dark:text-gray-400">Status</th>
                        <th class="px-5 py-3 text-right text-xs font-medium tracking-wide text-gray-500 uppercase dark:text-gray-400">Actions</th>
                      </tr>
                    </thead>
                    <tbody id="users-body"></tbody>
                  </table>
                </div>
                <p id="users-empty" class="hidden px-5 py-8 text-center text-sm text-gray-500 dark:text-gray-400">No users yet. Create the first one with "Create User".</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <dialog id="create-dialog" class="w-full max-w-md rounded-2xl border border-gray-200 bg-white p-0 text-gray-800 backdrop:bg-gray-900/50 dark:border-gray-800 dark:bg-gray-900 dark:text-white/90">
      <div class="flex items-start justify-between gap-4 border-b border-gray-100 p-4 sm:p-6 dark:border-gray-800">
        <h3 class="text-base font-medium">Create user</h3>
        <button id="create-dialog-close" type="button" aria-label="Close" class="inline-flex size-9 items-center justify-center rounded-lg border border-gray-300 text-gray-500 transition hover:bg-gray-50 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-white/5">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12" /></svg>
        </button>
      </div>
      <form id="create-form" class="space-y-4 p-4 sm:p-6" novalidate>
        <div>
          <label for="create-username" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Username</label>
          <input id="create-username" type="text" required class="w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm focus:border-brand-400 focus:outline-none dark:border-gray-700" />
        </div>
        <div>
          <label for="create-password" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Password (min 8 chars)</label>
          <div class="relative">
            <input id="create-password" type="password" required class="w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 pr-10 text-sm focus:border-brand-400 focus:outline-none dark:border-gray-700" />
            <button type="button" id="create-password-toggle" class="absolute right-2 top-1/2 -translate-y-1/2 p-1 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200" aria-label="Show password" title="Show password">
              <svg id="create-password-toggle-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>
        <div>
          <label for="create-role" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Role</label>
          <select id="create-role" class="w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm focus:border-brand-400 focus:outline-none dark:border-gray-700">
            <option value="administrator">Administrator</option>
            <option value="account_manager">Account Manager (Tenant Manager)</option>
          </select>
        </div>
        <p id="create-message" class="hidden text-sm"></p>
        <button type="submit" class="w-full rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-brand-600">Create user</button>
      </form>
    </dialog>

    <dialog id="edit-dialog" class="w-full max-w-md rounded-2xl border border-gray-200 bg-white p-0 text-gray-800 backdrop:bg-gray-900/50 dark:border-gray-800 dark:bg-gray-900 dark:text-white/90">
      <div class="flex items-start justify-between gap-4 border-b border-gray-100 p-4 sm:p-6 dark:border-gray-800">
        <h3 class="text-base font-medium">Edit user</h3>
        <button id="edit-dialog-close" type="button" aria-label="Close" class="inline-flex size-9 items-center justify-center rounded-lg border border-gray-300 text-gray-500 transition hover:bg-gray-50 dark:border-gray-700 dark:text-gray-400 dark:hover:bg-white/5">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12" /></svg>
        </button>
      </div>
      <form id="edit-form" class="space-y-4 p-4 sm:p-6" novalidate>
        <div>
          <label for="edit-username" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Username</label>
          <input id="edit-username" type="text" required class="w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm focus:border-brand-400 focus:outline-none dark:border-gray-700" />
        </div>
        <div>
          <label for="edit-role" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Role</label>
          <select id="edit-role" class="w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm focus:border-brand-400 focus:outline-none dark:border-gray-700">
            <option value="administrator">Administrator</option>
            <option value="account_manager">Account Manager (Tenant Manager)</option>
          </select>
        </div>
        <div>
          <label for="edit-password" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">New password (optional, min 8)</label>
          <div class="relative">
            <input id="edit-password" type="password" class="w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 pr-10 text-sm focus:border-brand-400 focus:outline-none dark:border-gray-700" />
            <button type="button" id="edit-password-toggle" class="absolute right-2 top-1/2 -translate-y-1/2 p-1 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200" aria-label="Show password" title="Show password">
              <svg id="edit-password-toggle-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>
        <p id="edit-message" class="hidden text-sm"></p>
        <button type="submit" class="w-full rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-brand-600">Save changes</button>
      </form>
    </dialog>
  </body>
</html>
