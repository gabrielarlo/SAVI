<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Dashboard | LocalRAG</title>
    <script>
      (function () {
        if (!sessionStorage.getItem("localrag.sessionToken") && !sessionStorage.getItem("localrag.adminSecret")) {
          window.location.replace("/auth/signin");
        }
      })();
    </script>
  </head>
  <body
    x-data="{ page: 'dashboard', 'loaded': true, 'darkMode': false, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode')) ?? false;
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <!-- ===== Preloader Start ===== -->
    <include src="./partials/common/preloader.html"></include>
    <!-- ===== Preloader End ===== -->
    <div class="flex h-screen overflow-hidden">
      <include src="./partials/layout/app-layout/sidebar/index.html"></include>
      <div class="relative flex flex-1 flex-col overflow-x-hidden overflow-y-auto">
        <include src="./partials/layout/app-layout/header/index.html" />
        <main id="main-content">
          <div class="mx-auto max-w-(--breakpoint-2xl) p-4 pb-20 md:p-6 md:pb-6">
            <div x-data="{ pageTitle: 'Dashboard' }">
              <include src="./partials/common/page-breadcrumb.html" />
            </div>
            <div class="flex items-center justify-end gap-2 text-sm text-gray-500 dark:text-gray-400">
              <svg class="h-3 w-3 text-green-500" viewBox="0 0 12 12" aria-hidden="true">
                <circle cx="6" cy="6" r="5" fill="currentColor" class="animate-pulse" />
              </svg>
              <span>Live</span>
            </div>
            <div id="stats-error" class="hidden rounded-2xl border border-red-200 bg-red-50 p-4 text-sm text-red-600 dark:border-red-800 dark:bg-red-900/20 dark:text-red-400"></div>

            <section class="space-y-3">
              <h3 class="text-base font-medium text-gray-800 dark:text-white/90">Overview</h3>
              <div id="section-overview" class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4"></div>
            </section>

            <section class="space-y-3">
              <h3 class="text-base font-medium text-gray-800 dark:text-white/90">Tenants</h3>
              <div id="section-tenants" class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4"></div>
            </section>

            <section class="space-y-3">
              <h3 class="text-base font-medium text-gray-800 dark:text-white/90">Users</h3>
              <div id="section-users" class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4"></div>
            </section>

            <section class="space-y-3">
              <h3 class="text-base font-medium text-gray-800 dark:text-white/90">Activity</h3>
              <div id="section-activity" class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4"></div>
            </section>

            <section class="space-y-3">
              <h3 class="text-base font-medium text-gray-800 dark:text-white/90">API keys</h3>
              <div id="section-apikeys" class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4"></div>
            </section>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
